server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El backend no expone CORS: igual que el proxy de Vite en desarrollo.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
